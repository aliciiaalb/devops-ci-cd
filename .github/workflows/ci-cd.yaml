name: Dev CI Pipeline

on:
  pull_request:
    branches: [ dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd backend
          npm install

      - name: Run lint
        run: |
          cd backend
          npm run lint

      - name: Run audit
        run: |
          cd backend
          npm audit

      - name: Run security check with Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test

      - name: Run tests
        run: |
          cd backend
          npm test

      - name: Build Docker images
        run: |
          docker build -t frontend ./frontend
          docker build -t backend ./backend
